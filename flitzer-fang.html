<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flitzer-Fang</title>
<style>
  :root {
    --text: #2b2118;
    --muted: #6d5f50;
    --card: #fffdf7;
    --mark: #fff1a8;
    --bar-bg: #e8e1d3;
    --accent: #ffb703;
    --accent-dark: #e09a00;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
    color: var(--text);
    background: #9fd8ff;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  /* ---------- Himmel ---------- */
  #sky {
    position: fixed; inset: 0; overflow: hidden;
    background: linear-gradient(#6ec2ff 0%, #b9e3ff 55%, #e4f6d4 100%);
  }
  #sun {
    position: absolute; right: 6%; top: 18%;
    width: 110px; height: 110px; border-radius: 50%;
    background: radial-gradient(circle, #fff6b0 0%, #ffd84a 60%, #ffc21a 100%);
    box-shadow: 0 0 60px 20px rgba(255, 220, 80, .45);
    animation: sunpulse 4s ease-in-out infinite;
  }
  @keyframes sunpulse { 50% { transform: scale(1.06); } }
  .cloud {
    position: absolute; left: -260px;
    width: 200px; height: 60px; border-radius: 60px;
    background: #fff; opacity: .9;
    animation: drift linear infinite;
  }
  .cloud::before, .cloud::after {
    content: ""; position: absolute; background: #fff; border-radius: 50%;
  }
  .cloud::before { width: 90px; height: 90px; left: 30px; top: -45px; }
  .cloud::after  { width: 70px; height: 70px; left: 100px; top: -30px; }
  @keyframes drift { to { transform: translateX(calc(100vw + 520px)); } }
  #hills {
    position: absolute; left: -10%; right: -10%; bottom: -120px; height: 260px;
    background: radial-gradient(ellipse at 30% 0%, #8fd16a 0%, #6bbd4c 60%, #58a83c 100%);
    border-radius: 50% 50% 0 0;
  }

  /* ---------- Kopfzeile ---------- */
  #hud {
    position: fixed; left: 0; right: 0; top: 0; z-index: 5;
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px;
    padding: 12px 16px;
  }
  .round-btn {
    width: 56px; height: 56px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--card); border: 3px solid #f0e0c4;
    font-size: 1.7rem; text-decoration: none; cursor: pointer;
    box-shadow: 0 4px 0 #f0e0c4;
  }
  #left { display: flex; gap: 8px; }
  #center {
    background: var(--card); border-radius: 22px; padding: 10px 18px 12px;
    box-shadow: 0 5px 0 rgba(0,0,0,.12);
    text-align: center; min-width: 0;
  }
  #task {
    font-size: clamp(1.35rem, 4.4vw, 2.4rem); font-weight: bold;
    min-height: 1.3em; line-height: 1.25;
  }
  #task mark {
    background: var(--mark); color: var(--text);
    padding: 0 .25em; border-radius: .3em;
  }
  #task.pop { animation: taskpop .35s ease-out; }
  @keyframes taskpop { 0% { transform: scale(.7); opacity: 0; } 70% { transform: scale(1.06); } 100% { transform: scale(1); opacity: 1; } }
  #bar {
    height: 16px; margin-top: 8px; border-radius: 10px;
    background: var(--bar-bg); overflow: hidden;
  }
  #fill {
    height: 100%; width: 100%; border-radius: 10px;
    background: #44b65a;
    transition: background-color .3s;
  }
  #stats {
    display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
    font-weight: bold; font-size: 1.35rem;
  }
  .chip {
    background: var(--card); border-radius: 16px; padding: 4px 12px;
    box-shadow: 0 3px 0 rgba(0,0,0,.12); white-space: nowrap;
  }
  #streak.hot { animation: hot .5s ease-out; }
  @keyframes hot { 40% { transform: scale(1.35) rotate(-6deg); } }
  #count { font-size: .95rem; color: var(--muted); }

  /* ---------- Spielfeld ---------- */
  #field { position: fixed; left: 0; right: 0; bottom: 0; top: 0; z-index: 2; overflow: hidden; touch-action: none; }
  .item {
    position: absolute; left: 0; top: 0;
    width: var(--s); height: var(--s);
    cursor: pointer; will-change: transform;
  }
  .rot, .in { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .in { filter: drop-shadow(0 5px 3px rgba(0,0,0,.22)); }
  .emo { font-size: calc(var(--s) * .78); line-height: 1; pointer-events: none; }
  .in svg { pointer-events: none; }
  .in.pop { animation: pop .45s ease-out forwards; }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.45); } 100% { transform: scale(.2); opacity: 0; } }
  .in.wiggle { animation: wiggle .45s ease-in-out; }
  @keyframes wiggle {
    0%,100% { transform: translateX(0) rotate(0); }
    20% { transform: translateX(-10px) rotate(-12deg); }
    40% { transform: translateX(10px) rotate(12deg); }
    60% { transform: translateX(-7px) rotate(-8deg); }
    80% { transform: translateX(5px) rotate(5deg); }
  }
  .in.hint { animation: hint .6s ease-in-out infinite; filter: drop-shadow(0 0 12px #fff36b) drop-shadow(0 0 22px #ffd000); }
  @keyframes hint { 50% { transform: scale(1.25); } }

  .conf {
    position: absolute; width: 12px; height: 12px; border-radius: 3px;
    pointer-events: none; z-index: 3;
    animation: conf .8s ease-out forwards;
  }
  @keyframes conf { to { transform: translate(var(--dx), var(--dy)) rotate(400deg); opacity: 0; } }
  .float {
    position: absolute; z-index: 4; pointer-events: none;
    font-weight: bold; font-size: 2rem; color: var(--text);
    background: var(--card); padding: 4px 14px; border-radius: 16px;
    box-shadow: 0 4px 0 rgba(0,0,0,.12);
    transform: translate(-50%, -50%);
    animation: floatup 1s ease-out forwards;
    white-space: nowrap;
  }
  @keyframes floatup {
    0% { transform: translate(-50%, -50%) scale(.6); opacity: 0; }
    20% { transform: translate(-50%, -70%) scale(1.1); opacity: 1; }
    100% { transform: translate(-50%, -160%) scale(1); opacity: 0; }
  }

  /* ---------- Start- und Endbild ---------- */
  #overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255, 248, 236, .55);
    padding: 16px;
  }
  #overlay.hidden { display: none; }
  .card {
    background: var(--card); border-radius: 32px; padding: 32px 28px;
    max-width: 520px; width: 100%; text-align: center;
    box-shadow: 0 10px 0 rgba(0,0,0,.12), 0 20px 50px rgba(0,0,0,.15);
    animation: taskpop .4s ease-out;
  }
  .card h1 { font-size: clamp(2.2rem, 8vw, 3.2rem); margin: 0 0 8px; }
  .card p { font-size: 1.45rem; margin: 10px 0; line-height: 1.35; }
  .card .small { font-size: 1.1rem; color: var(--muted); }
  .stars { font-size: 3.4rem; letter-spacing: 6px; margin: 6px 0; }
  .stars span { display: inline-block; animation: starin .5s ease-out backwards; }
  .stars span:nth-child(2) { animation-delay: .2s; }
  .stars span:nth-child(3) { animation-delay: .4s; }
  @keyframes starin { 0% { transform: scale(0) rotate(-90deg); } 70% { transform: scale(1.3); } }
  .stars .off { filter: grayscale(1); opacity: .3; }
  .btn {
    display: inline-block; margin: 14px 8px 0;
    font: inherit; font-size: 1.6rem; font-weight: bold;
    padding: 14px 34px; border-radius: 22px; border: none; cursor: pointer;
    background: var(--accent); color: var(--text);
    box-shadow: 0 6px 0 var(--accent-dark); text-decoration: none;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--accent-dark); }
  .btn.light { background: #fff; border: 3px solid #f0e0c4; box-shadow: 0 6px 0 #f0e0c4; }

  @media (max-width: 600px) {
    #hud { gap: 8px; padding: 10px 10px; }
    .round-btn { width: 46px; height: 46px; font-size: 1.4rem; }
    #stats { font-size: 1.05rem; }
    #center { padding: 8px 10px 10px; }
  }
</style>
</head>
<body>
  <div id="sky">
    <div id="sun"></div>
    <div class="cloud" style="top:22%; animation-duration:70s; animation-delay:-10s"></div>
    <div class="cloud" style="top:48%; transform:scale(.7); animation-duration:95s; animation-delay:-50s"></div>
    <div class="cloud" style="top:70%; animation-duration:80s; animation-delay:-30s"></div>
    <div id="hills"></div>
  </div>

  <div id="field"></div>

  <div id="hud">
    <div id="left">
      <a class="round-btn" href="index.html" aria-label="Zur Startseite">🏠</a>
      <button class="round-btn" id="soundBtn" aria-label="Töne an oder aus">🎵</button>
    </div>
    <div id="center">
      <div id="task">Flitzer-Fang</div>
      <div id="bar"><div id="fill"></div></div>
    </div>
    <div id="stats">
      <span class="chip" id="streak">🔥 0</span>
      <span class="chip" id="score">⭐ 0</span>
      <span id="count"></span>
    </div>
  </div>

  <div id="overlay">
    <div class="card" id="card"></div>
  </div>

<script>
(function () {
  "use strict";

  // ---------- Einstellungen ----------
  const TOTAL = 20;          // Aufgaben pro Spiel
  const START_TIME = 10;     // Sekunden für die erste Aufgabe
  const MIN_TIME = 3.5;      // kürzeste Zeit
  const SHRINK = 0.93;       // richtig: Zeit wird kürzer
  const SHRINK_STREAK = 0.88; // richtig mit Serie ab 3: Zeit wird schneller kürzer

  // ---------- Dinge, die fliegen ----------
  const OBJECTS = [
    { e: "🍌", n: "Banane", g: "f" },
    { e: "🚗", n: "Auto", g: "n" },
    { e: "📖", n: "Buch", g: "n" },
    { e: "🍎", n: "Apfel", g: "m" },
    { e: "⚽", n: "Ball", g: "m" },
    { e: "🐟", n: "Fisch", g: "m" },
    { e: "🚀", n: "Rakete", g: "f" },
    { e: "🐱", n: "Katze", g: "f" },
    { e: "🐶", n: "Hund", g: "m" },
    { e: "🍦", n: "Eis", g: "n" },
    { e: "🌸", n: "Blume", g: "f" },
    { e: "🦆", n: "Ente", g: "f" },
    { e: "👟", n: "Schuh", g: "m" },
    { e: "🎈", n: "Ballon", g: "m" },
    { e: "🐸", n: "Frosch", g: "m" },
    { e: "🍕", n: "Pizza", g: "f" },
    { e: "✈️", n: "Flugzeug", g: "n" },
    { e: "🐝", n: "Biene", g: "f" },
    { e: "🦋", n: "Schmetterling", g: "m" },
    { e: "🐢", n: "Schildkröte", g: "f" }
  ].map(o => Object.assign({ type: "obj", key: "obj:" + o.n }, o));

  const COLORS = [
    { c: "rot", hex: "#e63946" },
    { c: "blau", hex: "#2f6fdf" },
    { c: "gelb", hex: "#ffc823" },
    { c: "grün", hex: "#2fa84f" }
  ];
  const SHAPES = [
    { n: "Dreieck", g: "n", eye: 64, d: '<polygon points="50,6 95,90 5,90" />' },
    { n: "Kreis", g: "m", eye: 44, d: '<circle cx="50" cy="50" r="44" />' },
    { n: "Quadrat", g: "n", eye: 44, d: '<rect x="8" y="8" width="84" height="84" rx="10" />' },
    { n: "Stern", g: "m", eye: 50, d: '<polygon points="50,3 62,37 98,37 69,58 80,94 50,73 20,94 31,58 2,37 38,37" />' },
    { n: "Herz", g: "n", eye: 38, d: '<path d="M50 92 C18 68 3 50 3 31 C3 15 16 5 30 5 C40 5 46 11 50 19 C54 11 60 5 70 5 C84 5 97 15 97 31 C97 50 82 68 50 92Z" />' }
  ];

  const ART = { m: "den", f: "die", n: "das" };
  const ADJ_END = { m: "en", f: "e", n: "e" };
  const VERBS = ["Tippe auf", "Fang", "Klicke auf", "Schnapp dir"];
  const PRAISE = ["Toll!", "Richtig!", "Klasse!", "Super!", "Jawoll!", "Prima!"];
  const CONF_COLORS = ["#ffc823", "#e63946", "#2f6fdf", "#2fa84f", "#ff8fd1", "#9b5de5"];

  function shapeItem(col, sh) {
    return { type: "shape", key: "shape:" + col.c + ":" + sh.n, c: col.c, hex: col.hex, n: sh.n, g: sh.g, sh: sh };
  }
  function phrase(k) {
    if (k.type === "obj") return ART[k.g] + " " + k.n;
    return ART[k.g] + " " + k.c + ADJ_END[k.g] + " " + k.n;
  }

  // ---------- Hilfen ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const randObj = () => pick(OBJECTS);
  const randShape = () => shapeItem(pick(COLORS), pick(SHAPES));
  const randAny = () => (Math.random() < 0.55 ? randObj() : randShape());

  function store(key, val) {
    try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); } catch (e) { return null; }
  }

  // ---------- Elemente ----------
  const field = document.getElementById("field");
  const hud = document.getElementById("hud");
  const taskEl = document.getElementById("task");
  const fillEl = document.getElementById("fill");
  const streakEl = document.getElementById("streak");
  const scoreEl = document.getElementById("score");
  const countEl = document.getElementById("count");
  const overlay = document.getElementById("overlay");
  const card = document.getElementById("card");
  const soundBtn = document.getElementById("soundBtn");

  // ---------- Töne ----------
  let sound = store("ff-sound") !== "off";
  let ac = null;
  function updateSoundBtn() { soundBtn.style.opacity = sound ? "1" : ".4"; }
  soundBtn.addEventListener("click", () => { sound = !sound; store("ff-sound", sound ? "on" : "off"); updateSoundBtn(); });
  updateSoundBtn();
  function tones(freqs, dur, type, vol) {
    if (!sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
      const t0 = ac.currentTime;
      freqs.forEach((f, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        const s = t0 + i * dur;
        o.type = type; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, s);
        g.gain.exponentialRampToValueAtTime(vol, s + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
        o.connect(g); g.connect(ac.destination);
        o.start(s); o.stop(s + dur + 0.05);
      });
    } catch (e) { /* ohne Ton weiterspielen */ }
  }
  const sfxRight = () => tones([660, 880, 1320], 0.08, "triangle", 0.18);
  const sfxBig = () => tones([523, 659, 784, 1047, 1319], 0.08, "triangle", 0.18);
  const sfxWrong = () => tones([240, 190], 0.12, "sine", 0.12);
  const sfxTimeout = () => tones([392, 330], 0.15, "sine", 0.1);

  // ---------- Zustand ----------
  let W = 0, H = 0, top0 = 0, size = 96;
  let items = [];
  let phase = "idle";          // idle | play | wait | over
  let task = null;
  let taskIndex = 0, score = 0, streak = 0, bestStreak = 0;
  let duration = START_TIME, remaining = START_TIME;
  let spawnTimer = 0;
  let lastTarget = null;

  function layout() {
    top0 = hud.offsetHeight + 4;
    W = window.innerWidth;
    H = window.innerHeight - top0;
    field.style.top = top0 + "px";
    size = Math.round(Math.max(76, Math.min(118, Math.min(W, H * 1.4) * 0.13)));
    field.style.setProperty("--s", size + "px");
  }
  window.addEventListener("resize", layout);

  // ---------- Aufgaben ----------
  function different(target, gen) {
    for (let i = 0; i < 30; i++) {
      const k = gen();
      if (k.key !== target.key) return k;
    }
    return target.type === "obj" ? randShape() : randObj();
  }
  function tricky(target) {
    const r = Math.random();
    if (r < 0.42) {         // gleiche Farbe, andere Form
      return shapeItem(COLORS.find(c => c.c === target.c), pick(SHAPES));
    } else if (r < 0.84) {  // gleiche Form, andere Farbe
      return shapeItem(pick(COLORS), target.sh);
    }
    return randAny();
  }
  function makeTask(i) {
    let target, gen;
    const r = Math.random();
    const useObj = i < 6 || (i < 12 && r < 0.5) || (i >= 12 && r < 0.3);
    if (useObj) {
      target = randObj();
      gen = i < 6 ? randObj : randAny;
    } else {
      target = randShape();
      gen = i < 12 ? (() => (Math.random() < 0.65 ? randShape() : randObj())) : (() => tricky(target));
    }
    if (lastTarget && target.key === lastTarget.key) return makeTask(i);
    lastTarget = target;
    return {
      target: target,
      verb: pick(VERBS),
      hadWrong: false,
      pool: () => different(target, gen)
    };
  }
  const idleTask = { target: null, pool: randAny };

  function maxItems() {
    if (phase === "idle" || phase === "over") return 4;
    return taskIndex < 4 ? 3 : 4;
  }
  function speedFactor() {
    if (phase === "idle" || phase === "over") return 0.8;
    return 1 + taskIndex * 0.035;
  }

  // ---------- Fliegende Dinge ----------
  function render(k, dir) {
    if (k.type === "obj") {
      const flip = (k.n === "Auto" || k.n === "Fisch" || k.n === "Ente" || k.n === "Schildkröte" || k.n === "Hund" || k.n === "Katze") && dir > 0;
      return '<span class="emo"' + (flip ? ' style="transform:scaleX(-1);display:inline-block"' : "") + ">" + k.e + "</span>";
    }
    const e = k.sh.eye, dx = dir * 3;
    const eyes =
      '<circle cx="37" cy="' + e + '" r="9" fill="#fff" stroke="#2b2118" stroke-width="2.5"/>' +
      '<circle cx="63" cy="' + e + '" r="9" fill="#fff" stroke="#2b2118" stroke-width="2.5"/>' +
      '<circle cx="' + (37 + dx) + '" cy="' + (e + 1) + '" r="4.5" fill="#2b2118"/>' +
      '<circle cx="' + (63 + dx) + '" cy="' + (e + 1) + '" r="4.5" fill="#2b2118"/>' +
      '<path d="M43 ' + (e + 14) + " Q50 " + (e + 20) + " 57 " + (e + 14) + '" stroke="#2b2118" stroke-width="3" fill="none" stroke-linecap="round"/>';
    return '<svg viewBox="0 0 100 100" width="100%" height="100%">' +
      '<g fill="' + k.hex + '" stroke="rgba(0,0,0,.25)" stroke-width="4" stroke-linejoin="round">' + k.sh.d + "</g>" +
      eyes + "</svg>";
  }

  function laneFree(y) {
    return items.every(it => it.dead || Math.abs(it.baseY - y) > size * 0.95 || (it.x > size * 1.5 && it.x < W - size * 2.5));
  }

  function spawn(isTarget) {
    const t = (phase === "play" || phase === "wait") ? task : idleTask;
    const kind = isTarget && t.target ? t.target : t.pool();
    const dir = Math.random() < 0.5 ? 1 : -1;
    const amp = Math.random() < 0.6 ? rand(12, Math.min(45, H * 0.08)) : 0;
    const lo = amp + 6, hi = Math.max(lo + 1, H - size - amp - 6);
    let baseY = rand(lo, hi);
    for (let i = 0; i < 10 && !laneFree(baseY); i++) baseY = rand(lo, hi);

    const el = document.createElement("div");
    el.className = "item";
    el.innerHTML = '<div class="rot"><div class="in">' + render(kind, dir) + "</div></div>";
    const it = {
      el: el, rotEl: el.firstChild, inEl: el.firstChild.firstChild, kind: kind,
      x: dir > 0 ? -size : W, baseY: baseY, y: baseY, lo: lo, hi: hi,
      vx: dir * (W / rand(5.5, 8)) * speedFactor(),
      vy: Math.random() < 0.4 ? rand(-25, 25) : 0,
      amp: amp, freq: rand(0.5, 1.2), phase0: rand(0, 6.28),
      rotAmp: kind.type === "shape" ? rand(10, 25) : rand(4, 12), rotFreq: rand(0.4, 1),
      t: 0, dead: false
    };
    el.addEventListener("pointerdown", ev => { ev.preventDefault(); hit(it); });
    field.appendChild(el);
    items.push(it);
  }

  function removeItem(it) {
    it.dead = true;
    it.el.remove();
    items = items.filter(x => x !== it);
  }

  function targetOnScreen() {
    return task && task.target && items.some(it => !it.dead && it.kind.key === task.target.key);
  }

  // ---------- Treffer ----------
  function centerOf(it) { return { x: it.x + size / 2, y: it.y + size / 2 }; }

  function burst(x, y) {
    for (let i = 0; i < 18; i++) {
      const d = document.createElement("div");
      d.className = "conf";
      const a = Math.random() * Math.PI * 2, r = rand(60, 150);
      d.style.left = x + "px"; d.style.top = y + "px";
      d.style.setProperty("--dx", Math.cos(a) * r + "px");
      d.style.setProperty("--dy", Math.sin(a) * r + "px");
      d.style.background = pick(CONF_COLORS);
      field.appendChild(d);
      setTimeout(() => d.remove(), 850);
    }
  }
  function floatText(text, x, y) {
    const f = document.createElement("div");
    f.className = "float";
    f.textContent = text;
    f.style.left = Math.max(90, Math.min(W - 90, x)) + "px";
    f.style.top = Math.max(50, y) + "px";
    field.appendChild(f);
    setTimeout(() => f.remove(), 1000);
  }
  function restart(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function hit(it) {
    if (phase !== "play" || it.dead) return;
    if (it.kind.key === task.target.key) right(it); else wrong(it);
  }

  function right(it) {
    phase = "wait";
    it.dead = true;
    const p = centerOf(it);
    it.inEl.classList.add("pop");
    setTimeout(() => removeItem(it), 450);
    burst(p.x, p.y);

    score++;
    streak++;
    bestStreak = Math.max(bestStreak, streak);
    if (!task.hadWrong) {
      duration = Math.max(MIN_TIME, duration * (streak >= 3 ? SHRINK_STREAK : SHRINK));
    }

    let msg = pick(PRAISE);
    if (streak === 3) msg = "3 in Folge! 🔥";
    else if (streak === 5) msg = "Wahnsinn! 🔥🔥";
    else if (streak === 8) msg = "Blitzschnell! ⚡";
    else if (streak === 12) msg = "Unschlagbar! 🏆";
    else if (streak > 3 && streak % 5 === 0) msg = streak + " in Folge! 🚀";
    if (streak === 3 || streak === 5 || streak === 8 || streak === 12 || (streak > 3 && streak % 5 === 0)) sfxBig(); else sfxRight();
    floatText(msg, p.x, p.y - size * 0.3);
    updateStats(true);
    setTimeout(nextTask, 750);
  }

  function wrong(it) {
    task.hadWrong = true;
    streak = 0;
    updateStats(false);
    restart(it.inEl, "wiggle");
    sfxWrong();
  }

  function timeout() {
    phase = "wait";
    streak = 0;
    updateStats(false);
    sfxTimeout();
    let shown = false;
    items.forEach(it => {
      if (!it.dead && it.kind.key === task.target.key) {
        it.inEl.classList.add("hint");
        if (!shown) { const p = centerOf(it); floatText("Hier! 👀", p.x, p.y - size * 0.6); shown = true; }
      }
    });
    if (!shown) floatText("Weiter geht's!", W / 2, H / 3);
    setTimeout(nextTask, 1500);
  }

  // ---------- Ablauf ----------
  function updateStats(bump) {
    streakEl.textContent = "🔥 " + streak;
    scoreEl.textContent = "⭐ " + score;
    if (bump && streak >= 2) restart(streakEl, "hot");
    countEl.textContent = (phase === "idle" || phase === "over") ? "" : Math.min(taskIndex + 1, TOTAL) + " / " + TOTAL;
  }

  function updateBar() {
    const f = Math.max(0, remaining / duration);
    fillEl.style.width = (f * 100) + "%";
    fillEl.style.backgroundColor = f > 0.5 ? "#44b65a" : f > 0.25 ? "#f2b632" : "#f07b3f";
  }

  function showTask() {
    taskEl.innerHTML = task.verb + " <mark>" + phrase(task.target) + "</mark>!";
    restart(taskEl, "pop");
  }

  function nextTask() {
    items.forEach(it => it.inEl.classList.remove("hint"));
    taskIndex++;
    if (taskIndex >= TOTAL) { endGame(); return; }
    startTask();
  }

  function startTask() {
    task = makeTask(taskIndex);
    remaining = duration;
    phase = "play";
    showTask();
    updateBar();
    updateStats(false);
    if (!targetOnScreen()) spawnTimer = Math.min(spawnTimer, 0.25);
  }

  function startGame() {
    overlay.classList.add("hidden");
    taskIndex = 0; score = 0; streak = 0; bestStreak = 0;
    duration = START_TIME;
    lastTarget = null;
    startTask();
  }

  function endGame() {
    phase = "over";
    task = null;
    taskEl.textContent = "Geschafft!";
    fillEl.style.width = "0%";
    updateStats(false);
    const best = parseInt(store("ff-best") || "0", 10) || 0;
    const newBest = score > best;
    if (newBest) store("ff-best", String(score));
    const stars = score >= 17 ? 3 : score >= 11 ? 2 : 1;
    let starHtml = "";
    for (let i = 0; i < 3; i++) starHtml += '<span class="' + (i < stars ? "" : "off") + '">⭐</span>';
    const title = stars === 3 ? "Super gemacht!" : stars === 2 ? "Toll gemacht!" : "Gut gemacht!";
    card.innerHTML =
      "<h1>" + title + "</h1>" +
      '<div class="stars">' + starHtml + "</div>" +
      "<p>Du hast <b>" + score + "</b> von " + TOTAL + " gefangen.</p>" +
      "<p>Längste Serie: 🔥 <b>" + bestStreak + "</b></p>" +
      (newBest && best > 0 ? '<p class="small">Neuer Rekord! 🏆</p>' : (best > 0 ? '<p class="small">Dein Rekord: ' + Math.max(best, score) + "</p>" : "")) +
      '<button class="btn" id="again">Nochmal</button>' +
      '<a class="btn light" href="index.html">Startseite</a>';
    overlay.classList.remove("hidden");
    document.getElementById("again").addEventListener("click", startGame);
    if (stars === 3) sfxBig();
  }

  function showStart() {
    phase = "idle";
    taskEl.textContent = "Flitzer-Fang";
    fillEl.style.width = "100%";
    updateStats(false);
    card.innerHTML =
      "<h1>⚡ Flitzer-Fang</h1>" +
      "<p>Oben steht, was du fangen sollst.</p>" +
      "<p>Lies genau und tippe schnell darauf!</p>" +
      '<p class="small">Je schneller du bist, desto schneller wird es.</p>' +
      '<button class="btn" id="go">Los geht\'s!</button>';
    overlay.classList.remove("hidden");
    document.getElementById("go").addEventListener("click", startGame);
  }

  // ---------- Hauptschleife ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.t += dt;
      it.x += it.vx * dt;
      it.baseY += it.vy * dt;
      if (it.baseY < it.lo) { it.baseY = it.lo; it.vy = Math.abs(it.vy); }
      if (it.baseY > it.hi) { it.baseY = it.hi; it.vy = -Math.abs(it.vy); }
      it.y = it.baseY + it.amp * Math.sin(it.phase0 + it.t * it.freq * Math.PI * 2);
      it.el.style.transform = "translate(" + it.x.toFixed(1) + "px," + it.y.toFixed(1) + "px)";
      it.rotEl.style.transform = "rotate(" + (it.rotAmp * Math.sin(it.t * it.rotFreq * Math.PI * 2)).toFixed(1) + "deg)";
      if (!it.dead && (it.x < -size - 30 || it.x > W + 30)) removeItem(it);
    }

    const needTarget = phase === "play" && !targetOnScreen();
    const alive = items.filter(it => !it.dead).length;
    const limit = maxItems() + (needTarget ? 1 : 0);
    spawnTimer -= dt;
    if (needTarget && spawnTimer > 0.3) spawnTimer = 0.3;
    if (alive < limit && spawnTimer <= 0) {
      spawn(needTarget);
      spawnTimer = rand(0.6, 1.3) / speedFactor();
    }

    if (phase === "play") {
      remaining -= dt;
      updateBar();
      if (remaining <= 0) { remaining = 0; updateBar(); timeout(); }
    }
    requestAnimationFrame(frame);
  }

  layout();
  showStart();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
