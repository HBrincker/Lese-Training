<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wort-Memory</title>
<style>
  :root {
    --bg: #f3efff;
    --text: #2b2118;
    --muted: #6d5f50;
    --card: #fffdf7;
    --line: #e2d9f7;
    --back1: #7b61ff;
    --back2: #a48bff;
    --accent: #ffb703;
    --accent-dark: #e09a00;
    --good: #3fb760;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
    background-image: radial-gradient(circle at 15% 20%, #fff 0 2px, transparent 3px),
                      radial-gradient(circle at 70% 60%, #fff 0 2px, transparent 3px);
    background-size: 90px 90px, 130px 130px;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    display: flex; flex-direction: column; align-items: center;
    padding: 14px 16px 40px;
  }

  /* ---------- Kopf ---------- */
  #top {
    width: 100%; max-width: 900px;
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px;
  }
  .round-btn {
    width: 54px; height: 54px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--card); border: 3px solid var(--line);
    font-size: 1.6rem; text-decoration: none; cursor: pointer;
    box-shadow: 0 4px 0 var(--line);
  }
  #progress { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; font-size: 1.35rem; }
  #progress span { opacity: .25; filter: grayscale(1); transition: all .3s; }
  #progress span.done { opacity: 1; filter: none; animation: starin .5s ease-out; }
  @keyframes starin { 0% { transform: scale(0) rotate(-90deg); } 70% { transform: scale(1.4); } }

  /* ---------- Wort ---------- */
  #wordbox {
    margin-top: 22px; width: 100%; max-width: 900px;
    background: var(--card); border-radius: 30px;
    box-shadow: 0 6px 0 var(--line);
    padding: 22px 16px 24px; text-align: center;
  }
  #tag {
    display: inline-block; min-height: 1.6em;
    font-size: 1.05rem; font-weight: bold; color: var(--muted);
  }
  #tag span { background: #f6f2ff; border-radius: 12px; padding: 3px 12px; }
  #hint { font-size: 1.25rem; color: var(--muted); margin: 4px 0 10px; }
  #word {
    display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
    font-size: clamp(3rem, 12vw, 5.5rem); font-weight: bold; letter-spacing: 2px;
    min-height: 1.3em;
  }
  #slot {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 1.8em; height: 1.2em; padding: 0 .12em; margin-left: .05em;
    border: 4px dashed #b9a9f0; border-radius: 16px;
    color: #b9a9f0; transition: all .25s;
  }
  #slot.filled { color: var(--text); border-color: var(--accent); background: #fff6d6; }
  #slot.solved { border: 4px solid transparent; background: transparent; color: var(--text); padding: 0; margin-left: 0; min-width: 0; }
  #emo { font-size: clamp(3rem, 12vw, 5rem); margin-left: 16px; display: none; }
  #emo.show { display: inline-block; animation: emopop .6s ease-out; }
  @keyframes emopop { 0% { transform: scale(0) rotate(-30deg); } 70% { transform: scale(1.3) rotate(8deg); } 100% { transform: scale(1); } }
  #word.cheer { animation: cheer .6s ease-out; }
  @keyframes cheer { 40% { transform: scale(1.08); } }

  .btn {
    display: inline-block; margin-top: 18px;
    font: inherit; font-size: 1.6rem; font-weight: bold;
    padding: 14px 34px; border-radius: 22px; border: none; cursor: pointer;
    background: var(--accent); color: var(--text);
    box-shadow: 0 6px 0 var(--accent-dark); text-decoration: none;
    transition: opacity .2s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--accent-dark); }
  .btn:disabled { opacity: .35; cursor: default; transform: none; box-shadow: 0 6px 0 var(--accent-dark); }
  .btn.light { background: #fff; border: 3px solid var(--line); box-shadow: 0 6px 0 var(--line); }

  /* ---------- Karten ---------- */
  #cards {
    margin-top: 26px; width: 100%; max-width: 900px;
    display: flex; flex-wrap: wrap; align-content: flex-start; justify-content: center;
    gap: var(--gap, 18px);
    min-height: 200px;
  }
  .card {
    width: clamp(92px, 22vw, 140px); aspect-ratio: 3 / 4;
    perspective: 900px; cursor: pointer;
    animation: deal .45s ease-out backwards;
  }
  @keyframes deal { 0% { transform: translateY(-40px) scale(.6) rotate(-10deg); opacity: 0; } }
  .card .inner {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d; transition: transform .45s;
  }
  .card.open .inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; border-radius: 20px;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .back {
    background:
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.25) 0 22%, transparent 23%),
      repeating-linear-gradient(45deg, var(--back1) 0 14px, var(--back2) 14px 28px);
    border: 5px solid #fff;
    box-shadow: 0 6px 0 #5a45c9;
    color: #fff; font-size: 3rem; font-weight: bold;
  }
  .front {
    transform: rotateY(180deg);
    background: var(--card); border: 5px solid var(--accent);
    box-shadow: 0 6px 0 var(--accent-dark);
    font-size: clamp(2rem, 7vw, 3rem); font-weight: bold;
  }
  .card.right .front { border-color: var(--good); box-shadow: 0 6px 0 #2c8f49; }
  .card.wiggle { animation: wiggle .5s ease-in-out; }
  @keyframes wiggle {
    0%,100% { transform: translateX(0) rotate(0); }
    20% { transform: translateX(-10px) rotate(-6deg); }
    40% { transform: translateX(10px) rotate(6deg); }
    60% { transform: translateX(-6px) rotate(-3deg); }
    80% { transform: translateX(4px) rotate(2deg); }
  }
  .card.away { opacity: .25; transition: opacity .4s; pointer-events: none; }

  .conf {
    position: fixed; width: 12px; height: 12px; border-radius: 3px;
    pointer-events: none; z-index: 20;
    animation: conf .9s ease-out forwards;
  }
  @keyframes conf { to { transform: translate(var(--dx), var(--dy)) rotate(420deg); opacity: 0; } }

  /* ---------- Start und Ende ---------- */
  #overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: rgba(243, 239, 255, .85); padding: 16px;
  }
  #overlay.hidden { display: none; }
  .panel {
    background: var(--card); border-radius: 32px; padding: 30px 26px;
    max-width: 560px; width: 100%; text-align: center;
    box-shadow: 0 10px 0 var(--line), 0 20px 50px rgba(0,0,0,.12);
    max-height: 92vh; overflow: auto;
  }
  .panel h1 { font-size: clamp(2.2rem, 8vw, 3rem); margin: 0 0 8px; }
  .panel p { font-size: 1.4rem; margin: 10px 0; line-height: 1.35; }
  .panel .small { font-size: 1.05rem; color: var(--muted); }
  .found { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 14px 0 4px; }
  .found span {
    background: #f6f2ff; border-radius: 14px; padding: 6px 12px;
    font-size: 1.2rem; font-weight: bold;
  }
  .demo { display: inline-flex; gap: 10px; margin: 8px 0; }
  .demo div {
    width: 54px; height: 72px; border-radius: 12px; border: 3px solid #fff;
    background: repeating-linear-gradient(45deg, var(--back1) 0 8px, var(--back2) 8px 16px);
    box-shadow: 0 4px 0 #5a45c9;
    color: #fff; font-weight: bold; font-size: 1.6rem;
    display: flex; align-items: center; justify-content: center;
  }
  .pack {
    background: #f6f2ff; border-radius: 20px; padding: 12px 16px; margin: 14px 0 6px;
    text-align: left; font-size: 1.15rem;
  }
  .pack b { font-size: 1.25rem; }
  .meter { height: 14px; border-radius: 8px; background: #e2d9f7; overflow: hidden; margin: 6px 0 10px; }
  .meter div { height: 100%; border-radius: 8px; }
  .meter .m-new { background: #a48bff; }
  .meter .m-sure { background: var(--good); }
  .gift { font-size: 1.5rem; font-weight: bold; animation: emopop .7s ease-out; }
  .reset {
    margin-top: 18px; background: none; border: none; cursor: pointer;
    font: inherit; font-size: .95rem; color: var(--muted); text-decoration: underline;
  }

  @media (max-width: 600px) {
    .round-btn { width: 46px; height: 46px; font-size: 1.35rem; }
    #progress { font-size: 1rem; }
  }
</style>
</head>
<body>
  <div id="top">
    <a class="round-btn" href="index.html" aria-label="Zur Startseite">🏠</a>
    <div id="progress"></div>
    <button class="round-btn" id="soundBtn" aria-label="Töne an oder aus">🎵</button>
  </div>

  <div id="wordbox">
    <div id="tag"></div>
    <div id="hint">Welche Karte macht das Wort fertig?</div>
    <div id="word"><span id="start"></span><span id="slot">?</span><span id="emo"></span></div>
    <button class="btn" id="choose" disabled>✓ Das passt!</button>
  </div>

  <div id="cards"></div>

  <div id="overlay"><div class="panel" id="panel"></div></div>

<script>
(function () {
  "use strict";

  // ================= Einstellungen =================
  const PACK_SIZE = 30;     // Wörter pro Päckchen
  const GAME_LEN = 12;      // Wörter pro Spiel (ohne Wiederholungen von Fehlern)
  const NEW_PER_GAME = 5;   // neue Wörter pro Spiel, sobald schon ein paar gelernt sind
  const SURE = 2;           // ab so vielen Punkten gilt ein Wort als „sicher"
  const OLD_PACK_WEIGHT = 0.5; // ältere Päckchen kommen seltener dran
  const SAVE_KEY = "wm-stand-v1";

  // Anfang, Ende, Bild, ähnliche (falsche) Enden.
  // Die ähnlichen Enden sind so gewählt, dass sie kein echtes Wort ergeben.
  // Je 30 Wörter bilden ein Päckchen (in dieser Reihenfolge).
  const WORDS = [
    // ---------- Päckchen 1 ----------
    ["Kne", "te", "🎨", ["de", "ze", "ta", "tu"]],
    ["Ha", "se", "🐰", ["ze", "so", "fe", "me"]],
    ["Ho", "se", "👖", ["ze", "sa", "be", "ne"]],
    ["Na", "se", "👃", ["ze", "so", "de", "ne"]],
    ["Ro", "se", "🌹", ["ze", "fe", "me", "so"]],
    ["Do", "se", "🥫", ["ze", "fe", "ma", "so"]],
    ["Bana", "ne", "🍌", ["me", "ni", "nu", "le"]],
    ["Toma", "te", "🍅", ["de", "ze", "ti", "tu"]],
    ["Lam", "pe", "💡", ["be", "pa", "pi", "ke"]],
    ["Tas", "se", "☕", ["ze", "sa", "si", "fe"]],
    ["Son", "ne", "☀️", ["me", "na", "ni", "le"]],
    ["Bir", "ne", "🍐", ["me", "na", "ni", "le"]],
    ["Fla", "sche", "🍾", ["scha", "schi", "sse", "schu"]],
    ["Ta", "sche", "👜", ["scha", "schi", "che", "schu"]],
    ["Na", "del", "🪡", ["tel", "dal", "dil", "dol"]],
    ["Ap", "fel", "🍎", ["vel", "fal", "fil", "fol"]],
    ["En", "te", "🦆", ["ze", "ta", "tu", "ti"]],
    ["Ei", "mer", "🪣", ["wer", "mar", "mir", "mel"]],
    ["Ga", "bel", "🍴", ["pel", "bal", "bil", "del"]],
    ["Wol", "ke", "☁️", ["ge", "ka", "ki", "che"]],
    ["Blu", "me", "🌸", ["ne", "ma", "mi", "be"]],
    ["Ker", "ze", "🕯️", ["se", "za", "zi", "ke"]],
    ["Rake", "te", "🚀", ["de", "ze", "ta", "ti"]],
    ["Pup", "pe", "🪆", ["be", "pa", "pi", "ke"]],
    ["Bril", "le", "👓", ["la", "li", "ne", "re"]],
    ["Gei", "ge", "🎻", ["ke", "ga", "gi", "che"]],
    ["Zie", "ge", "🐐", ["ke", "ga", "gi", "che"]],
    ["Bie", "ne", "🐝", ["me", "na", "ni", "le"]],
    ["Kro", "ne", "👑", ["me", "te", "ni", "le"]],
    ["Pal", "me", "🌴", ["ne", "mo", "mi", "be"]],
    // ---------- Päckchen 2 ----------
    ["Ka", "tze", "🐱", ["ze", "tse", "tza", "tzi"]],
    ["Rau", "pe", "🐛", ["be", "pa", "pi", "ge"]],
    ["Schne", "cke", "🐌", ["ke", "cka", "cki", "gge"]],
    ["Kä", "se", "🧀", ["ze", "sa", "fe", "ne"]],
    ["Mu", "schel", "🐚", ["schal", "schil", "chel", "sel"]],
    ["Ham", "mer", "🔨", ["ner", "mar", "mir", "wer"]],
    ["Pin", "sel", "🖌️", ["sal", "sil", "zel", "fel"]],
    ["Ti", "ger", "🐯", ["ker", "gar", "gir", "der"]],
    ["Lö", "we", "🦁", ["ve", "wa", "wi", "be"]],
    ["Robo", "ter", "🤖", ["der", "tar", "tir", "ser"]],
    ["Ku", "chen", "🍰", ["chan", "chin", "chon", "gen"]],
    ["Ho", "nig", "🍯", ["mig", "nag", "nug", "lig"]],
    ["But", "ter", "🧈", ["der", "tar", "tir", "ser"]],
    ["Kame", "ra", "📷", ["la", "ri", "ro", "na"]],
    ["Zitro", "ne", "🍋", ["me", "na", "ni", "le"]],
    ["Melo", "ne", "🍉", ["me", "na", "ni", "le"]],
    ["Gur", "ke", "🥒", ["ge", "ka", "ki", "che"]],
    ["Am", "pel", "🚦", ["bel", "pal", "pil", "fel"]],
    ["Va", "se", "🏺", ["ze", "sa", "fe", "ne"]],
    ["Ra", "be", "🐦", ["de", "ba", "bi", "we"]],
    ["Möh", "re", "🥕", ["le", "ra", "ri", "de"]],
    ["Ze", "bra", "🦓", ["pra", "bro", "bri", "dra"]],
    ["Sä", "ge", "🪚", ["ke", "ga", "gi", "che"]],
    ["Tor", "te", "🎂", ["de", "ze", "to", "ti"]],
    ["Fe", "der", "🪶", ["ter", "dar", "dir", "ler"]],
    ["Ki", "wi", "🥝", ["vi", "wa", "wo", "bi"]],
    ["Giraf", "fe", "🦒", ["ve", "fa", "fi", "pe"]],
    ["Pingu", "in", "🐧", ["im", "an", "un", "ein"]],
    ["Mü", "tze", "🧢", ["ze", "tse", "tza", "tzi"]],
    ["Lu", "pe", "🔍", ["be", "pa", "pi", "ke"]]
  ].map((w, i) => ({ start: w[0], end: w[1], emo: w[2], close: w[3], key: w[0] + w[1], pack: Math.floor(i / PACK_SIZE) }));

  const PACKS = [];
  WORDS.forEach(w => { (PACKS[w.pack] = PACKS[w.pack] || []).push(w); });

  // Ganz andere Enden (keine gemeinsamen Buchstaben mit dem richtigen Ende)
  const FAR = ["xu", "ix", "ob", "ru", "wa", "ug", "bo", "ol", "ek", "ip", "om", "eu", "pf", "ox"];

  // Schwierigkeit hängt an den Punkten des Wortes:
  // neues Wort = 2 Karten mit ganz anderem Ende, gut geübtes Wort = viele ähnliche Karten.
  function level(score) {
    if (score <= 0) return { cards: 2, close: 0, gap: "min(30vw, 260px)" };
    if (score === 1) return { cards: 3, close: 1, gap: "min(12vw, 110px)" };
    if (score === 2) return { cards: 4, close: 2, gap: "min(6vw, 50px)" };
    if (score === 3) return { cards: 4, close: 3, gap: "22px" };
    if (score === 4) return { cards: 5, close: 4, gap: "12px" };
    return { cards: 6, close: 4, gap: "10px" };
  }

  // ================= Hilfen =================
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const sharesLetter = (a, b) => a.toLowerCase().split("").some(ch => b.toLowerCase().includes(ch));

  function makeCards(w, lv) {
    const close = shuffle(w.close).slice(0, Math.min(lv.close, lv.cards - 1));
    const far = shuffle(FAR.filter(f => !sharesLetter(f, w.end) && !close.includes(f))).slice(0, lv.cards - 1 - close.length);
    return shuffle([{ text: w.end, right: true }].concat(close.concat(far).map(t => ({ text: t, right: false }))));
  }

  // ================= Spielstand =================
  // words[key] = { s: Punkte, n: wie oft gespielt, r: wie oft gleich richtig }
  let save = loadSave();

  function emptySave() { return { pack: 0, words: {}, games: 0 }; }
  function loadSave() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s && typeof s === "object" && s.words) return s;
      }
    } catch (e) { /* ohne gespeicherten Stand weiter */ }
    return emptySave();
  }
  function writeSave() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* nicht schlimm */ }
  }
  const info = w => save.words[w.key];
  const seen = w => !!info(w);
  const score = w => (info(w) ? info(w).s : 0);

  function packStatus(p) {
    const list = PACKS[p] || [];
    return {
      total: list.length,
      learned: list.filter(seen).length,
      sure: list.filter(w => score(w) >= SURE).length
    };
  }
  // Ein Päckchen ist geschafft, wenn alle Wörter gelernt und „sicher" sind.
  function checkUnlock() {
    let opened = false;
    while (save.pack < PACKS.length - 1) {
      const st = packStatus(save.pack);
      if (st.learned === st.total && st.sure === st.total) { save.pack++; opened = true; }
      else break;
    }
    return opened;
  }

  // Gewicht für Wiederholungen: je mehr Punkte, desto seltener.
  function weight(w) {
    const base = 1 / Math.pow(1 + score(w), 2);
    return w.pack === save.pack ? base : base * OLD_PACK_WEIGHT;
  }
  function weightedPick(list, n) {
    const pool = list.slice(), out = [];
    while (out.length < n && pool.length) {
      const total = pool.reduce((a, w) => a + weight(w), 0);
      let r = Math.random() * total, k = 0;
      for (; k < pool.length - 1; k++) { r -= weight(pool[k]); if (r <= 0) break; }
      out.push(pool.splice(k, 1)[0]);
    }
    return out;
  }

  function buildGame() {
    const current = PACKS[save.pack];
    const unseen = current.filter(w => !seen(w));
    const known = WORDS.filter(seen);
    let newCount = 0;
    if (unseen.length) {
      newCount = known.length < GAME_LEN ? GAME_LEN - known.length : NEW_PER_GAME;
      newCount = Math.max(Math.min(NEW_PER_GAME, unseen.length), Math.min(newCount, unseen.length));
    }
    const fresh = shuffle(unseen).slice(0, newCount);
    const review = weightedPick(known, GAME_LEN - fresh.length);
    // leichte (wenig Punkte) zuerst, schwere zum Schluss
    return fresh.concat(review)
      .map(w => ({ w: w, isNew: !seen(w), repeat: false, sort: score(w) + Math.random() * 0.9 }))
      .sort((a, b) => a.sort - b.sort);
  }

  // ================= Elemente =================
  const startEl = document.getElementById("start");
  const slotEl = document.getElementById("slot");
  const emoEl = document.getElementById("emo");
  const wordEl = document.getElementById("word");
  const hintEl = document.getElementById("hint");
  const tagEl = document.getElementById("tag");
  const chooseBtn = document.getElementById("choose");
  const cardsEl = document.getElementById("cards");
  const progressEl = document.getElementById("progress");
  const overlay = document.getElementById("overlay");
  const panel = document.getElementById("panel");
  const soundBtn = document.getElementById("soundBtn");

  // ================= Töne =================
  let sound = true;
  try { sound = localStorage.getItem("wm-sound") !== "off"; } catch (e) { /* Standard: an */ }
  let ac = null;
  function updateSoundBtn() { soundBtn.style.opacity = sound ? "1" : ".4"; }
  soundBtn.addEventListener("click", () => {
    sound = !sound;
    try { localStorage.setItem("wm-sound", sound ? "on" : "off"); } catch (e) { /* egal */ }
    updateSoundBtn();
  });
  updateSoundBtn();
  function tones(freqs, dur, type, vol) {
    if (!sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
      const t0 = ac.currentTime;
      freqs.forEach((f, i) => {
        const o = ac.createOscillator(), g = ac.createGain(), s = t0 + i * dur;
        o.type = type; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, s);
        g.gain.exponentialRampToValueAtTime(vol, s + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
        o.connect(g); g.connect(ac.destination);
        o.start(s); o.stop(s + dur + 0.05);
      });
    } catch (e) { /* ohne Ton weiterspielen */ }
  }
  const sfxFlip = () => tones([520], 0.06, "triangle", 0.08);
  const sfxRight = () => tones([523, 659, 784, 1047], 0.09, "triangle", 0.18);
  const sfxWrong = () => tones([240, 190], 0.13, "sine", 0.12);

  // ================= Spielablauf =================
  let queue = [], pos = 0, cur = null, cards = [], openIdx = -1, busy = false, solved = false;
  let results = [], newlyLearned = 0, packAtStart = 0;

  function drawProgress() {
    progressEl.innerHTML = "";
    queue.forEach((q, i) => {
      const s = document.createElement("span");
      s.textContent = q.repeat ? "🔁" : "⭐";
      if (i < pos || (i === pos && solved)) s.className = "done";
      progressEl.appendChild(s);
    });
  }

  function startRound() {
    cur = queue[pos];
    cur.wrong = false;
    solved = false; busy = false; openIdx = -1;
    const w = cur.w;
    startEl.textContent = w.start;
    slotEl.textContent = "?";
    slotEl.className = "";
    emoEl.className = ""; emoEl.textContent = w.emo;
    tagEl.innerHTML = cur.repeat ? "<span>🔁 Nochmal üben</span>" : cur.isNew ? "<span>🆕 Neues Wort</span>" : "";
    hintEl.textContent = "Welche Karte macht das Wort fertig?";
    chooseBtn.textContent = "✓ Das passt!";
    chooseBtn.disabled = true;
    chooseBtn.onclick = choose;

    const lv = level(score(w));
    cardsEl.style.setProperty("--gap", lv.gap);
    cards = makeCards(w, lv);
    cardsEl.innerHTML = "";
    cards.forEach((c, i) => {
      const el = document.createElement("div");
      el.className = "card";
      el.style.animationDelay = (i * 0.08) + "s";
      el.innerHTML = '<div class="inner"><div class="face back">?</div><div class="face front"></div></div>';
      el.querySelector(".front").textContent = c.text;
      el.addEventListener("click", () => flip(i));
      c.el = el;
      cardsEl.appendChild(el);
    });
    drawProgress();
  }

  function flip(i) {
    if (busy || solved) return;
    const c = cards[i];
    if (openIdx === i) {
      c.el.classList.remove("open");
      openIdx = -1;
      slotEl.textContent = "?"; slotEl.className = "";
      chooseBtn.disabled = true;
      return;
    }
    if (openIdx >= 0) cards[openIdx].el.classList.remove("open");
    c.el.classList.add("open");
    openIdx = i;
    sfxFlip();
    slotEl.textContent = c.text;
    slotEl.className = "filled";
    chooseBtn.disabled = false;
  }

  // Punkte vergeben und speichern
  function record(w, firstTry, isRepeat) {
    const d = save.words[w.key] || { s: 0, n: 0, r: 0 };
    if (!save.words[w.key]) newlyLearned++;
    if (!isRepeat) {
      d.n++;
      if (firstTry) { d.s++; d.r++; }
      else d.s = Math.max(0, d.s - 1);
    }
    save.words[w.key] = d;
    writeSave();
  }

  function choose() {
    if (busy || solved || openIdx < 0) return;
    const c = cards[openIdx];
    const w = cur.w;
    if (c.right) {
      solved = true;
      record(w, !cur.wrong, cur.repeat);
      // Erst falsch? Dann kommt das Wort am Ende nochmal.
      if (cur.wrong && !cur.repeat) queue.push({ w: w, isNew: false, repeat: true });
      results.push({ w: w, ok: !cur.wrong, repeat: cur.repeat });

      c.el.classList.add("right");
      slotEl.className = "solved";
      emoEl.className = "show";
      wordEl.classList.remove("cheer"); void wordEl.offsetWidth; wordEl.classList.add("cheer");
      cards.forEach(o => { if (o !== c) o.el.classList.add("away"); });
      sfxRight();
      const r = wordEl.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2);
      hintEl.textContent = cur.wrong && !cur.repeat ? "Gefunden! Das Wort üben wir am Ende nochmal." : "Super! Das Wort heißt:";
      chooseBtn.textContent = pos + 1 < queue.length ? "Weiter ➜" : "Fertig ➜";
      chooseBtn.onclick = next;
      drawProgress();
    } else {
      cur.wrong = true;
      busy = true;
      chooseBtn.disabled = true;
      sfxWrong();
      c.el.classList.remove("wiggle"); void c.el.offsetWidth; c.el.classList.add("wiggle");
      hintEl.textContent = "Hmm, das passt nicht. Probier eine andere Karte!";
      setTimeout(() => {
        c.el.classList.remove("open", "wiggle");
        openIdx = -1;
        slotEl.textContent = "?"; slotEl.className = "";
        busy = false;
      }, 750);
    }
  }

  function next() {
    pos++;
    if (pos >= queue.length) { endGame(); return; }
    startRound();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function burst(x, y) {
    const colors = ["#ffc823", "#e63946", "#2f6fdf", "#2fa84f", "#ff8fd1", "#9b5de5"];
    for (let i = 0; i < 22; i++) {
      const d = document.createElement("div");
      d.className = "conf";
      const a = Math.random() * Math.PI * 2, r = 70 + Math.random() * 130;
      d.style.left = x + "px"; d.style.top = y + "px";
      d.style.setProperty("--dx", Math.cos(a) * r + "px");
      d.style.setProperty("--dy", Math.sin(a) * r + "px");
      d.style.background = colors[i % colors.length];
      document.body.appendChild(d);
      setTimeout(() => d.remove(), 950);
    }
  }

  function startGame() {
    overlay.classList.add("hidden");
    queue = buildGame();
    pos = 0; results = []; newlyLearned = 0;
    packAtStart = save.pack;
    startRound();
  }

  function packHtml() {
    const p = save.pack, st = packStatus(p);
    const learnedPct = Math.round(st.learned / st.total * 100);
    const surePct = Math.round(st.sure / st.total * 100);
    const phase = st.learned < st.total ? "Neue Wörter lernen" : "Wiederholen, bis alle sicher sind";
    return '<div class="pack">' +
      "<b>📦 Päckchen " + (p + 1) + " von " + PACKS.length + "</b><br>" +
      '<span class="small">' + phase + "</span>" +
      "<div>Gelernt: " + st.learned + " von " + st.total + "</div>" +
      '<div class="meter"><div class="m-new" style="width:' + learnedPct + '%"></div></div>' +
      "<div>Sicher: " + st.sure + " von " + st.total + "</div>" +
      '<div class="meter"><div class="m-sure" style="width:' + surePct + '%"></div></div>' +
      "</div>";
  }

  function endGame() {
    save.games = (save.games || 0) + 1;
    const opened = checkUnlock();
    writeSave();
    let list = "";
    results.forEach(r => {
      const mark = r.repeat ? " 🔁" : r.ok ? "" : " ✏️";
      list += "<span>" + r.w.key + " " + r.w.emo + mark + "</span>";
    });
    const allDone = PACKS.every((pk, i) => packStatus(i).sure === packStatus(i).total);
    panel.innerHTML =
      "<h1>Geschafft! 🎉</h1>" +
      (newlyLearned ? "<p>" + newlyLearned + (newlyLearned === 1 ? " neues Wort" : " neue Wörter") + " gelernt!</p>" : "<p>Toll wiederholt!</p>") +
      '<div class="found">' + list + "</div>" +
      (opened ? '<p class="gift">🎁 Päckchen ' + (save.pack + 1) + " ist jetzt offen!</p>" : "") +
      (allDone ? '<p class="gift">🏆 Alle Päckchen sicher!</p>' : "") +
      packHtml() +
      '<button class="btn" id="again">Nochmal</button> ' +
      '<a class="btn light" href="index.html">Startseite</a>';
    overlay.classList.remove("hidden");
    document.getElementById("again").addEventListener("click", startGame);
    sfxRight();
  }

  function showStart() {
    const first = Object.keys(save.words).length === 0;
    panel.innerHTML =
      "<h1>🃏 Wort-Memory</h1>" +
      "<p>Oben steht ein Wort, aber das Ende fehlt.</p>" +
      '<div class="demo"><div>?</div><div>?</div></div>' +
      "<p>Dreh die Karten um und lies.<br>Welche macht das Wort fertig?</p>" +
      packHtml() +
      '<button class="btn" id="go">' + (first ? "Los geht's!" : "Weiter üben!") + "</button><br>" +
      (first ? "" : '<button class="reset" id="reset">Spielstand löschen</button>');
    overlay.classList.remove("hidden");
    document.getElementById("go").addEventListener("click", startGame);
    const rb = document.getElementById("reset");
    if (rb) rb.addEventListener("click", () => {
      if (window.confirm("Wirklich den ganzen Spielstand löschen? Alle gelernten Wörter fangen dann von vorn an.")) {
        save = emptySave();
        writeSave();
        showStart();
      }
    });
  }

  drawProgress();
  showStart();
})();
</script>
</body>
</html>
