<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lese-Training</title>
  <style>
    :root {
      --bg: #fff8ec;
      --text: #3a2e22;
      --muted: #7a6a58;
      --card: #ffffff;
      --card-border: #f0e0c4;
      --accent: #ffb703;
      --accent-dark: #e09a00;
      --soon: #f6efe2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 48px;
    }
    h1 {
      font-size: clamp(2.4rem, 8vw, 4rem);
      margin: 8px 0 4px;
      letter-spacing: 1px;
    }
    .sub {
      font-size: 1.3rem;
      color: var(--muted);
      margin: 0 0 32px;
    }
    .tiles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 820px;
    }
    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 220px;
      padding: 24px;
      border-radius: 28px;
      background: var(--card);
      border: 4px solid var(--card-border);
      color: var(--text);
      text-decoration: none;
      font-size: 1.6rem;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 6px 0 var(--card-border);
      transition: transform .12s, box-shadow .12s, border-color .12s;
    }
    a.tile:hover, a.tile:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 6px 0 var(--accent-dark);
      transform: translateY(-3px);
      outline: none;
    }
    a.tile:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--accent-dark);
    }
    .icon { font-size: 4.5rem; line-height: 1; }
    .tile.soon {
      background: var(--soon);
      border-style: dashed;
      box-shadow: none;
      color: var(--muted);
      font-weight: normal;
    }
  </style>
</head>
<body>
  <h1>Lese-Training</h1>
  <p class="sub">Was möchtest du lesen?</p>

  <main class="tiles">
    <a class="tile" href="kinderzimmer-escape.html">
      <span class="icon">🚪</span>
      Kinderzimmer-Escape
    </a>
    <a class="tile" href="flitzer-fang.html">
      <span class="icon">⚡</span>
      Flitzer-Fang
    </a>
    <a class="tile" href="wort-memory.html">
      <span class="icon">🃏</span>
      Wort-Memory
    </a>
    <div class="tile soon">
      <span class="icon">✨</span>
      Bald gibt es hier mehr
    </div>
  </main>
</body>
</html>
